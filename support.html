<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — Uni Tracker</title>
<style>
  :root{
    --paper: #F7F5F0;
    --ink: #1C2333;
    --slate: #5C6478;
    --hairline: #DEDAD0;
    --seal: #A8793A;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.6;
  }

  .wrap{
    max-width: 760px;
    margin: 0 auto;
    padding: 3rem 1.2rem;
  }

  .eyebrow{
    display: block;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--seal);
    margin-bottom: 0.7rem;
  }

  h1{ margin: 0 0 0.8rem; }

  section{
    padding: 1.4rem 0;
    border-top: 1px solid var(--hairline);
  }

  a{ color: inherit; }

  .muted{ color: var(--slate); }

  footer{
    margin-top: 1rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--hairline);
    color: var(--slate);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Uni Tracker</span>
    <h1>Support</h1>
    <p class="muted">Direkte Kontaktmöglichkeiten für Fragen, Fehlerberichte und Datenschutzanfragen.</p>
  </header>

  <section>
    <h2>Kontakt</h2>
    <p>E-Mail: <a href="mailto:studytrack@outlook.de?subject=StudyTrack%20Support">studytrack@outlook.de</a></p>
    <p>Öffentliches Ticket: <a href="https://github.com/JonasK05/Uni-Tracker-support/issues/new" target="_blank" rel="noopener noreferrer">GitHub Issue erstellen</a></p>
  </section>

  <section>
    <h2>Navigation</h2>
    <p><a href="web.html">Zur Hauptseite (web.html)</a></p>
    <p><a href="privacy.html">Zur Datenschutz-Unterseite</a></p>
  </section>

  <footer>
    Uni Tracker · Support
  </footer>
</div>
</body>
</html>
